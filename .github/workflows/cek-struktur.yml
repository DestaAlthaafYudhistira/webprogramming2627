name: Sistem Proteksi Struktur & Fungsi Ujian

on:
  push:
    branches: [ "*" ]

jobs:
  verifikasi-kode:
    name: Cek Keberadaan File & Struktur Fungsi
    runs-on: ubuntu-latest

    steps:
      - name: Menarik (Checkout) kode dari repositori
        uses: actions/checkout@v4

      - name: 1. Validasi Nama dan Posisi File
        run: |
          echo "Mengecek apakah ada file yang hilang atau dipindah..."
          FILES=("src/components/layout/Header.jsx" "src/components/layout/SideBar.jsx" "src/components/layout/Footer.jsx" "src/pages/Beranda.jsx" "src/pages/Profil.jsx" "src/pages/Pendidikan.jsx" "src/pages/Riset.jsx" "src/pages/Mahasiswa.jsx" "src/pages/LainLain.jsx" "src/assets/style.css" "package.json")
          MISSING=0
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ HILANG: $FILE"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then exit 1; fi

      - name: 2. Validasi Baris Kode Wajib (Deklarasi Fungsi)
        run: |
          echo "Memeriksa apakah mahasiswa mengubah nama fungsi komponen..."
          ERROR=0

          # Fungsi pembantu untuk memindai teks
          cek_teks() {
            local file=$1
            local teks_wajib=$2
            # grep akan mencari teks di dalam file. Jika tidak ketemu, maka ERROR
            if ! grep -q "$teks_wajib" "$file"; then
              echo "❌ PELANGGARAN di $file: Anda menghapus atau mengubah deklarasi '$teks_wajib'"
              ERROR=1
            fi
          }

          # Mendaftarkan teks yang TIDAK BOLEH dihapus oleh mahasiswa
          cek_teks "soal_uts/src/pages/Beranda.jsx" "export default function Beranda"
          cek_teks "soal_uts/src/pages/Profil.jsx" "export default function Profil"
          cek_teks "soal_uts/src/pages/Pendidikan.jsx" "export default function Pendidikan"
          cek_teks "soal_uts/src/pages/Riset.jsx" "export default function Riset"
          cek_teks "soal_uts/src/pages/Mahasiswa.jsx" "export default function Mahasiswa"
          cek_teks "soal_uts/src/pages/LainLain.jsx" "export default function LainLain"
          
          # Cek juga untuk komponen layout
          cek_teks "soal_uts/src/components/layout/Header.jsx" "export default function Header"
          cek_teks "soal_uts/src/components/layout/SideBar.jsx" "export default function SideBar"
          cek_teks "soal_uts/src/components/layout/Footer.jsx" "export default function Footer"

          # Memastikan perintah 'return' tidak dihapus di salah satu file utama
          cek_teks "soal_uts/src/pages/Beranda.jsx" "return"

          if [ $ERROR -eq 1 ]; then
            echo ""
            echo "Status: UJIAN DIBATALKAN. Struktur fungsi utama (export default function) tidak boleh dimodifikasi!"
            exit 1
          else
            echo ""
            echo "✅ AMAN: Struktur deklarasi fungsi dipertahankan dengan baik."
            exit 0
          fi