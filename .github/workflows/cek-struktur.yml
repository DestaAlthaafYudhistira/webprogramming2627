name: UTS Web Programming

on:
  push:
    branches: [ "uts-131026" ]

jobs:
  verifikasi-kode:
    name: Cek Validasi Kegiatan TODO 1 s.d 17
    runs-on: ubuntu-latest

    # Menyetel default folder ke 'soal_uts'
    defaults:
      run:
        working-directory: ./soal_uts

    steps:
      - name: Mengambil kode mahasiswa (beserta seluruh riwayat commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ---------------------------------------------------------
      # STEP 1: Instalasi
      # ---------------------------------------------------------
      - name: 1.  Lakukan instal npm
        run: |
          echo "Lakukan instal...."
          npm install
      
      # ---------------------------------------------------------
      # STEP 2: Cek Keberadaan File Inti
      # ---------------------------------------------------------
      - name: 2. Validasi Nama dan Posisi File
        run: |
          echo "Mengecek apakah ada file yang hilang atau dipindah..."
          FILES=("src/components/layout/Header.jsx" "src/components/layout/SideBar.jsx" "src/components/layout/Footer.jsx" "src/pages/Beranda.jsx" "src/pages/Profil.jsx" "src/pages/Pendidikan.jsx" "src/pages/Riset.jsx" "src/pages/Mahasiswa.jsx" "src/pages/LainLain.jsx" "src/assets/style.css" "package.json")
          MISSING=0
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ HILANG: $FILE"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then exit 1; fi

      # ---------------------------------------------------------
      # STEP 3: Cek Deklarasi Fungsi (Tidak Boleh Diubah)
      # ---------------------------------------------------------
      - name: 3. Validasi Baris Kode Wajib (Deklarasi Fungsi)
        run: |
          echo "Memeriksa apakah mahasiswa mengubah nama fungsi komponen..."
          ERROR=0

          # Fungsi pembantu untuk memindai teks
          cek_teks() {
            local file=$1
            local teks_wajib=$2
            # grep akan mencari teks di dalam file. Jika tidak ketemu, maka ERROR
            if ! grep -q "$teks_wajib" "$file"; then
              echo "❌ PELANGGARAN di $file: Anda menghapus atau mengubah deklarasi '$teks_wajib'"
              ERROR=1
            fi
          }

          # Mendaftarkan teks yang TIDAK BOLEH dihapus oleh mahasiswa
          cek_teks "src/pages/Beranda.jsx" "export default function Beranda"
          cek_teks "src/pages/Profil.jsx" "export default function Profil"
          cek_teks "src/pages/Pendidikan.jsx" "export default function Pendidikan"
          cek_teks "src/pages/Riset.jsx" "export default function Riset"
          cek_teks "src/pages/Mahasiswa.jsx" "export default function Mahasiswa"
          cek_teks "src/pages/LainLain.jsx" "export default function LainLain"
          
          # Cek juga untuk komponen layout
          cek_teks "src/components/layout/Header.jsx" "export default function Header"
          cek_teks "src/components/layout/SideBar.jsx" "export default function SideBar"
          cek_teks "src/components/layout/Footer.jsx" "export default function Footer"

          # Memastikan perintah 'return' tidak dihapus di salah satu file utama
          cek_teks src/pages/Beranda.jsx" "return"

          if [ $ERROR -eq 1 ]; then
            echo ""
            echo "Status: UJIAN DIBATALKAN. Struktur fungsi utama (export default function) tidak boleh dimodifikasi!"
            exit 1
          else
            echo ""
            echo "✅ AMAN: Struktur deklarasi fungsi dipertahankan dengan baik."
            exit 0
          fi

      # ---------------------------------------------------------
      # STEP 4: Cek Penghapusan Komentar (//) pada Import
      # ---------------------------------------------------------
      - name: 4. Validasi Aktivasi Import (Hapus '//')
        run: |
          echo "Memeriksa pengaktifan import di App.jsx..."
          ERROR=0
          
          # 1. Cek apakah import style.css sudah aktif (tanpa // di depannya)
          # ^\s* berarti baris harus diawali dengan 'import' (boleh ada spasi, tapi tidak boleh ada //)
          if grep -Eq "^\s*import '\./assets/style\.css';" "src/App.jsx"; then
            echo "✅ AMAN: import style.css sudah diaktifkan."
          else
            echo "❌ GAGAL: Anda belum menghapus '//' pada import './assets/style.css' atau baris tersebut terhapus."
            ERROR=1
          fi

          # 2. Cek apakah import react-router-dom sudah aktif
          if grep -Eq "^\s*import \{ Routes, Route \} from 'react-router-dom';" "src/App.jsx"; then
            echo "✅ AMAN: import react-router-dom sudah diaktifkan."
          else
            echo "❌ GAGAL: Anda belum menghapus '//' pada import { Routes, Route } from 'react-router-dom' atau baris tersebut terhapus."
            ERROR=1
          fi

          # Jika ada salah satu yang belum diaktifkan, batalkan PR
          if [ $ERROR -eq 1 ]; then
            echo "Status: UJIAN GAGAL. Harap aktifkan baris import sesuai instruksi (TODO)!"
            exit 1
          fi

      # ---------------------------------------------------------
      # STEP 5: Cek Import Komponen Layout (TODO 1)
      # ---------------------------------------------------------
      - name: 5.  Validasi Import Layout (TODO 1)
        run: |
          echo "Memeriksa TODO 1: Import Header, SideBar, dan Footer di App.jsx..."
          # 1. Cek Import Header
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Header\s+from\s+['\"]\./components/layout/Header(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Header berhasil di-import."
          else
            echo "❌ GAGAL: Import Header tidak ditemukan atau format path salah."
            ERROR=1
          fi
          # 2. Cek Import SideBar
          if grep -Eq "^\s*import\s+SideBar\s+from\s+['\"]\./components/layout/SideBar(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: SideBar berhasil di-import."
          else
            echo "❌ GAGAL: Import SideBar tidak ditemukan atau format path salah."
            ERROR=1
          fi
          # 3. Cek Import Footer
          if grep -Eq "^\s*import\s+Footer\s+from\s+['\"]\./components/layout/Footer(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Footer berhasil di-import."
          else
            echo "❌ GAGAL: Import Footer tidak ditemukan atau format path salah."
            ERROR=1
          fi
          # Keputusan Akhir Step 5
          if [ $ERROR -eq 1 ]; then
            echo "Status: UJIAN GAGAL. Harap selesaikan TODO 1 dengan benar!"
            exit 1
          fi
      # ---------------------------------------------------------
      # STEP 6: Cek Validasi commit  TODO 1
      # ---------------------------------------------------------
      - name: 6.  Validasi commit  TODO 1
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 1" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 1"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 1."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 1!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 1'"
            exit 1
          fi
      # ---------------------------------------------------------
      # STEP 7: TODO 2  komponen Pages (Beranda, Profil, dll)
      # ---------------------------------------------------------
      - name: 6.  Validasi Import komponen Pages (Beranda, Profil, dll) (TODO 2)
        run: |
          echo "Memeriksa TODO 2: Import Beranda, SideBar, dan Footer di App.jsx..."
          # 1. Cek Import Beranda
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Beranda\s+from\s+['\"]\./pages/Beranda(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Beranda berhasil di-import."
          else
            echo "❌ GAGAL: Import Beranda tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 2. Cek Import Profil
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Profil\s+from\s+['\"]\./pages/Profil(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Profil berhasil di-import."
          else
            echo "❌ GAGAL: Import Profil tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 3. Cek Import Pendidikan
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Pendidikan\s+from\s+['\"]\./pages/Pendidikan(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Pendidikan berhasil di-import."
          else
            echo "❌ GAGAL: Import Pendidikan tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 4. Cek Import Riset
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Riset\s+from\s+['\"]\./pages/Riset(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Riset berhasil di-import."
          else
            echo "❌ GAGAL: Import Riset tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 5. Cek Import Mahasiswa
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Mahasiswa\s+from\s+['\"]\./pages/Mahasiswa(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Mahasiswa berhasil di-import."
          else
            echo "❌ GAGAL: Import Mahasiswa tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 6. Cek Import LainLain
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+LainLain\s+from\s+['\"]\./pages/LainLain(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: LainLain berhasil di-import."
          else
            echo "❌ GAGAL: Import LainLain tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 7. Cek Import NotFound
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+NotFound\s+from\s+['\"]\./pages/NotFound(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: NotFound berhasil di-import."
          else
            echo "❌ GAGAL: Import NotFound tidak ditemukan atau format path salah."
            ERROR=1
          fi

          # 8. Cek Import Berita
          # Regex menoleransi kutip 1 atau 2, spasi, dan ekstensi .jsx opsional
          if grep -Eq "^\s*import\s+Berita\s+from\s+['\"]\./pages/Berita(\.jsx)?['\"]" "src/App.jsx"; then
            echo "✅ AMAN: Berita berhasil di-import."
          else
            echo "❌ GAGAL: Import Berita tidak ditemukan atau format path salah."
            ERROR=1
          fi
          
          # Keputusan Akhir Step 7
          if [ $ERROR -eq 1 ]; then
            echo "Status: UJIAN GAGAL. Harap selesaikan TODO 2 dengan benar!"
            exit 1
          fi
      # ---------------------------------------------------------
      # STEP 8: Cek  (TODO 2)
      # ---------------------------------------------------------
      - name: 8.  Validasi commit  (TODO 2)
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 2" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 2"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 2."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 2!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 2'"
            exit 1
          fi
      # ---------------------------------------------------------
      # STEP 9: Validasi Penempatan Komponen (TODO 3, 4, 5, 6 , 7)
      # ---------------------------------------------------------
      - name: 9.  Validasi (TODO 3, 4, 5, 6 ,7)
        run: |
          echo "Memeriksa penempatan komponen di dalam App.jsx..."
          ERROR=0

          # Cek TODO 3 (Header)
          # Regex <Header\s*/> mendeteksi penulisan <Header/> atau <Header />
          if grep -Eq "<Header\s*/?>" "src/App.jsx"; then
            echo "✅ AMAN: Komponen <Header /> sudah ditambahkan."
          else
            echo "❌ GAGAL: Komponen <Header /> tidak ditemukan pada TODO 3."
            ERROR=1
          fi

          # Cek TODO 4 (SideBar)
          if grep -Eq "<SideBar\s*/?>" "src/App.jsx"; then
            echo "✅ AMAN: Komponen <SideBar /> sudah ditambahkan."
          else
            echo "❌ GAGAL: Komponen <SideBar /> tidak ditemukan pada TODO 4."
            ERROR=1
          fi

          # Cek TODO 5 (Footer)
          if grep -Eq "<Footer\s*/?>" "src/App.jsx"; then
            echo "✅ AMAN: Komponen <Footer /> sudah ditambahkan."
          else
            echo "❌ GAGAL: Komponen <Footer /> tidak ditemukan pada TODO 5."
            ERROR=1
          fi

          # Cek TODO 6 (Routes)
          # Kita gunakan grep -F (Fixed strings) agar simbol {/* tidak dianggap sebagai regex
          if grep -Fq "{/* TODO 6 Routes" "src/App.jsx"; then
            echo "❌ GAGAL: Anda belum mengaktifkan blok Routes! (Komentar TODO 6 masih ada)."
            ERROR=1
          else
            # Memastikan mahasiswa menghapus komentar tetapi tidak tidak sengaja menghapus tag <Routes>-nya
            if grep -Eq "<Routes\s*>" "src/App.jsx"; then
              echo "✅ AMAN: Blok <Routes> berhasil diaktifkan."
            else
              echo "❌ GAGAL: Tag <Routes> tidak ditemukan. Apakah Anda tidak sengaja menghapusnya?"
              ERROR=1
            fi
          fi

          if [ $ERROR -eq 1 ]; then
            echo "Status: UJIAN GAGAL. Pastikan TODO 3, 4, 5, dan 6 dikerjakan dengan benar!"
            exit 1
          fi
      
      # ---------------------------------------------------------
      # STEP 10: Cek commit (TODO 3, 4, 5, 6,7)
      # ---------------------------------------------------------
      - name: 10.  Validasi commit  (TODO 3, 4, 5, 6, 7)
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 7" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 7"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 7."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 7!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 7'"
            exit 1
          fi

      # ---------------------------------------------------------
      # STEP 11: Validasi main.jsx (Import & TODO 8)
      # ---------------------------------------------------------
      - name: 11. Validasi main.jsx (TODO 8)
        run: |
          echo "Memeriksa main.jsx terkait import App dan TODO 8..."
          ERROR=0
          
          # 1. Cek apakah import App sudah aktif (tanpa //)
          # Menoleransi kutip tunggal/ganda dan opsional akhiran .jsx
          if grep -Eq "^\s*import\s+App\s+from\s+['\"]\./App(\.jsx)?['\"]" "src/main.jsx"; then
            echo "✅ AMAN: import App sudah diaktifkan."
          else
            echo "❌ GAGAL: Anda belum menghapus '//' pada import App di main.jsx."
            ERROR=1
          fi

          # 2. Cek apakah komentar TODO 8 sudah dihapus
          if grep -Fq "{/* TODO 8 App" "src/main.jsx"; then
            echo "❌ GAGAL: Anda belum mengaktifkan blok <App />! (Komentar TODO 8 masih ada)."
            ERROR=1
          else
            # Memastikan mahasiswa menghapus komentar tetapi tidak sengaja menghapus tag <App />
            if grep -Eq "<App\s*/?>" "src/main.jsx"; then
              echo "✅ AMAN: Komponen <App /> berhasil diaktifkan."
            else
              echo "❌ GAGAL: Tag <App /> tidak ditemukan. Apakah Anda tidak sengaja menghapusnya?"
              ERROR=1
            fi
          fi

          if [ $ERROR -eq 1 ]; then
            echo "Status: UJIAN GAGAL. Harap selesaikan instruksi pada main.jsx!"
            exit 1
          fi
      # ---------------------------------------------------------
      # STEP 12: Cek commit (TODO 8)
      # ---------------------------------------------------------
      - name: 12.  Validasi commit  (TODO 8)
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 8" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 8"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 8."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 8!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 8'"
            exit 1
          fi
      
      # ---------------------------------------------------------
      # STEP 13: Validasi Header.jsx (TODO 9)
      # ---------------------------------------------------------
      - name: 13. Validasi Header.jsx (TODO 9)
        run: |
          echo "Memeriksa pekerjaan TODO 9 di Header.jsx..."
          ERROR=0
          FILE="src/components/layout/Header.jsx"

          # 1. Cek Import NavLink (dari baris 2 di instruksi)
          if ! grep -Eq "^\s*import\s*\{\s*NavLink\s*\}\s*from\s*['\"]react-router-dom['\"]" "$FILE"; then
            echo "❌ GAGAL: Anda belum mengaktifkan import NavLink dari react-router-dom."
            ERROR=1
          fi

          # 2. Cek Import Gambar (dari baris 3 & 4 di instruksi)
          # Mencari teks import yang mengandung bgGambar dan header-bg.png
          if ! grep -Eq "import.*bgGambar.*header-bg\.png" "$FILE"; then
            echo "❌ GAGAL: Anda belum melakukan import gambar header-bg.png dengan nama bgGambar."
            ERROR=1
          fi

          # 3. Cek Elemen header dan className 'header-area'
          if ! grep -q "className=[\"']header-area[\"']" "$FILE"; then
            echo "❌ GAGAL: Elemen pembungkus utama dengan className=\"header-area\" tidak ditemukan."
            ERROR=1
          fi

          # 4. Cek Inline Style backgroundImage
          # Mengecek penulisan template literal untuk gambar background
          if ! grep -q "backgroundImage:\s*\`url(\${bgGambar})\`" "$FILE"; then
            echo "❌ GAGAL: Inline style backgroundImage dengan nilai \`url(\${bgGambar})\` tidak ditemukan atau penulisannya salah."
            ERROR=1
          fi

          # 5. Cek Konten Teks H1 dan P
          if ! grep -q "<h1>ProdiInformatika</h1>" "$FILE"; then
            echo "❌ GAGAL: Tag <h1>ProdiInformatika</h1> tidak ditemukan (pastikan huruf besar/kecil sesuai)."
            ERROR=1
          fi
          
          if ! grep -q "<p>Universitas Matana.</p>" "$FILE"; then
            echo "❌ GAGAL: Tag <p>Universitas Matana.</p> tidak ditemukan (pastikan titik di akhir kalimat disertakan)."
            ERROR=1
          fi

          # 6. Cek NavLink Beranda
          if ! grep -q "<NavLink\s*to=[\"']/[\"']>Beranda</NavLink>" "$FILE"; then
            echo "❌ GAGAL: Tag <NavLink to=\"/\">Beranda</NavLink> tidak ditemukan."
            ERROR=1
          fi

          if [ $ERROR -eq 1 ]; then
            echo "=========================================================="
            echo "Status: UJIAN GAGAL. Perbaiki Header.jsx sesuai instruksi TODO 9!"
            echo "Pastikan struktur HTML Anda mengandung class 'header-area', 'header-text', dan 'nav-menu'."
            echo "=========================================================="
            exit 1
          else
            echo "✅ AMAN: TODO 9 (Header.jsx) berhasil dikerjakan dengan benar."
          fi
      
      # ---------------------------------------------------------
      # STEP 14: Cek commit (TODO 9)
      # ---------------------------------------------------------
      - name: 14.  Validasi commit  (TODO 9)
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 9" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 9"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 9."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 9!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 9'"
            exit 1
          fi
      
      # ---------------------------------------------------------
      # STEP 15: Validasi Footer.jsx (TODO 10)
      # ---------------------------------------------------------
      - name: 15. Validasi Footer.jsx (TODO 10)
        run: |
          echo "Memeriksa pekerjaan TODO 10 di Footer.jsx..."
          ERROR=0

          FILE="src/components/layout/Footer.jsx"

          # 1. Cek keberadaan tag HTML dengan className='footer-area'
          if ! grep -Eq "<footer\s+className=[\"']footer-area[\"']" "$FILE"; then
            echo "❌ GAGAL: Tag <footer className=\"footer-area\"> tidak ditemukan atau salah penulisan."
            ERROR=1
          fi

          # 2. Cek teks statis Copyright dengan presisi tinggi (menggunakan -F)
          if ! grep -Fq "Copyright © Prodi Informatika | HTML5 | CSS | ReactJS Fundamentals" "$FILE"; then
            echo "❌ GAGAL: Teks Footer tidak sesuai. Pastikan teks sama persis dengan instruksi (termasuk simbol ©, huruf besar/kecil, dan spasi)."
            ERROR=1
          fi

          if [ $ERROR -eq 1 ]; then
            echo "=========================================================="
            echo "Status: UJIAN GAGAL. Perbaiki Footer.jsx sesuai instruksi TODO 10!"
            echo "=========================================================="
            exit 1
          else
            echo "✅ AMAN: TODO 10 (Footer.jsx) berhasil dikerjakan dengan benar."
          fi
      
      # ---------------------------------------------------------
      # STEP 16: Cek commit (TODO 10)
      # ---------------------------------------------------------
      - name: 16.  Validasi commit  (TODO 10)
        run: |
          echo "Memeriksa riwayat commit mahasiswa..."
          # Mengecek apakah ada pesan commit yang mengandung kata "TODO 10" (huruf besar/kecil bebas karena ada flag -i)
          if git log --oneline | grep -iq "todo 10"; then
          echo "✅ AMAN: Mahasiswa telah melakukan commit khusus untuk TODO 10."
          else
            echo "❌ GAGAL: Anda belum melakukan commit untuk TODO 10!"
            echo "Pastikan Anda menjalankan perintah: git commit -m 'selesai TODO 10'"
            exit 1
          fi
      
      # ---------------------------------------------------------
      # STEP 17: Validasi SideBar.jsx (TODO 11)
      # ---------------------------------------------------------
      - name: 17. Validasi SideBar.jsx (TODO 11)
        run: |
          echo "Memeriksa pekerjaan TODO 11 di SideBar.jsx..."
          ERROR=0
          FILE="src/components/layout/SideBar.jsx"

          # 1. Cek elemen aside pembungkus
          if ! grep -Eq "<aside\s+className=[\"']sidebar-area[\"']>" "$FILE"; then
            echo "❌ GAGAL: Tag <aside className=\"sidebar-area\"> tidak ditemukan."
            ERROR=1
          fi

          # 2. Cek Heading 3 (Berita Terbaru & Pencarian)
          if ! grep -q "<h3>Berita Terbaru</h3>" "$FILE"; then
            echo "❌ GAGAL: Tag <h3>Berita Terbaru</h3> tidak ditemukan."
            ERROR=1
          fi
          if ! grep -q "<h3>Pencarian</h3>" "$FILE"; then
            echo "❌ GAGAL: Tag <h3>Pencarian</h3> tidak ditemukan."
            ERROR=1
          fi

          # 3. Cek elemen div news-item
          if ! grep -Eq "className=[\"']news-item[\"']" "$FILE"; then
            echo "❌ GAGAL: Elemen <div className=\"news-item\"> tidak ditemukan."
